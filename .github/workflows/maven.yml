name: Sync Gitee to GitHub
on:
  push:
    branches: [ main, master, '*' ]
  workflow_dispatch:

env:
  PROJECT_NAME: ${{ github.event.repository.name }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          # token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: view Project
        run: |
          ls -lah xxl-job/
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: |
            pom.xml
            **/pom.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Build with Maven
        run: |
          #  mvn -f pom.xml clean package -pl module-a -am [-pl module-a：构建指定模块 -am：同时构建依赖模块]  -Pprod -DskipTests [多模块-pl common,service-a,service-b】
          # 使用模块路径 mvn clean packag -pl ./common,./service-a,./service-b
          # 排除模块 mvn package -pl '!web,!test'
          mvn -f xxl-job/pom.xml clean package -pl ./xxl-job-admin,./xxl-job-executor-samples/xxl-job-executor-sample-springboot -am -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
      - name: view Build Project
        run: |
          ls -alh xxl-job/xxl-job-admin/target/*.jar
          ls -alh xxl-job/xxl-job-executor-samples/xxl-job-executor-sample-springboot/target/*.jar
      # --platform=linux/arm64 ARM64（M1 / ARM服务器）  linux/amd64  【# --build-arg ROOT_PASSWORD=1qaz@WSX \】
      #- name: Prepare docker context
      #  run: |
      #    cp \
      #    $(find xxl-job/xxl-job-admin/target \
      #    -name "*.jar" \
      #    ! -name "*sources.jar" \
      #    ! -name "*javadoc.jar") \
      #    docker/app.jar
      - name: Prepare application jars
        shell: bash
        run: |
          set -euo pipefail
          index=1
          find . -maxdepth 5 -type f -name "*.jar" \
            ! -name "*-sources*.jar" \
            ! -name "*-javadoc*.jar" \
            | while IFS= read -r jar
          do
            if jar tf "$jar" | grep -q "^BOOT-INF/"; then
              filename=$(basename "$jar")
              echo "Found Spring Boot jar: $jar"
              mkdir -p ./apps/app$index
              cp "$jar" "./apps/app$index/$filename"
              echo "Copied: ./apps/app$index/$filename"
              index=$((index+1))
            fi
          done
#      - name: Clean docker cache
#        run: |
#          docker system prune -af
#          docker builder prune
#          docker system df
      - name: Build
        run: |
          ls -alh ./apps/
          export PROJECT_DIR=$GITHUB_WORKSPACE
          docker build --build-arg HOST_WORK_DIR=$PROJECT_DIR \
            --no-cache \
            --progress=plain \
            --build-arg MYSQL_VERSION=9.7.1 \
            --build-arg GLIBC_VER=2.28 \
            -t "${PROJECT_NAME}:latest" \
            -f $PROJECT_DIR/Dockerfile-supervisor \
            $PROJECT_DIR
          # type=local 导出的不是镜像文件系统根目录，而是：当前 build 阶段（target）的输出内容: 
          # 如果想导出完整镜像： docker buildx build -t my-image:v1 --output type=docker,dest=image.tar
          docker buildx build -f $PROJECT_DIR/Dockerfile-supervisor -t "${PROJECT_NAME}:export" --output type=local,dest=./docker-build-artifact .
          docker images
      - name: Get repo name
        run: |
          # ${变量##*/} 表示删除最后一个 / 前面的内容。
          REPO_NAME=${GITHUB_REPOSITORY##*/}
          echo "repo=$REPO_NAME"
      - name: Create Dockerfile
        run: |
          cat > ./docker-build-artifact/Dockerfile <<'EOF'
          FROM debian:13-slim

          ARG ROOT_PASSWORD=Root231@123456
          ENV ROOT_PASSWORD=${ROOT_PASSWORD}

          COPY ./runtime /runtime

          ENV JAVA_HOME=/runtime/jre
          ENV PATH=$JAVA_HOME/bin:$PATH

          EXPOSE 3306 8080
    
          RUN apt-get update && \
              apt-get install -y --no-install-recommends supervisor bash netcat-openbsd \
              gettext-base && \
              JAVA_HOME=/runtime/jre && PATH=$JAVA_HOME/bin:$PATH && \
              groupadd mysql && useradd -r -g mysql mysql && \
              mkdir -p /data/mysql && \
              chown -R mysql:mysql /runtime/mysql-binary /runtime/mysql-binary/logs && \
              rm -rf /var/lib/apt/lists/* && \
              cp -av /runtime/lib/*.so* /lib/x86_64-linux-gnu/ && rm -rf /runtime/lib
    
          CMD ["/runtime/mysql-binary/init.sh"]
          EOF
      - name: Export Image
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
        # https://oneuptime.com/blog/post/2026-01-16-docker-export-import-images/view
        # docker save $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "my-app") -o my-apps.tar
        #run: |
        #  docker save duckdb-python:latest \
        #  -o duckdb-python.tar # 加载：docker load -i nginx.tar
        #run: docker save duckdb-python:latest | gzip > duckdb-python.tar.gz 加载 gunzip -c nginx.tar.gz | docker load 或者 zcat nginx.tar.gz | docker load
        run: |
          docker save -o "$IMAGE_NAME-image.tar" "${IMAGE_NAME}:latest"  # 加载 docker load -i image.tar
          ls -alh .
          ls -alh ./docker-build-artifact/runtime
          cd ./docker-build-artifact/
          docker build -t "${PROJECT_NAME}:latest-mini" .
          docker save -o "$IMAGE_NAME-image-mini.tar" "${IMAGE_NAME}:latest-mini"
          ls -alh .
      # compression-level: 0 表示不压缩，0~9，默认6, 但是还是会生成zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-image-artifact"
          path: "${{ github.event.repository.name }}-image.tar"
          # compression-level: 0
